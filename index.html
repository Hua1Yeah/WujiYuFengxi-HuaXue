<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#126b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="随身复习">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>无机及分析化学 · 随身复习</title>
<style>
:root{
  --bg:#f3f6f3; --card:#ffffff; --fg:#17231d; --muted:#6b7d72; --line:#e3e9e4;
  --brand:#126b4f; --brand2:#1f9d74; --ok:#1f9d74; --no:#cf4040;
  --chip:#eef4ef; --shadow:0 6px 20px rgba(18,60,44,.07);
}
body.dark{
  --bg:#0e1512; --card:#161f1a; --fg:#e8f0ea; --muted:#93a79b; --line:#25332b;
  --brand:#3fbf92; --brand2:#3fbf92; --ok:#3fbf92; --no:#ff7b7b;
  --chip:#1e2a23; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);font-size:16px;line-height:1.62;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 44px}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);border-bottom:1px solid var(--line);
  max-width:640px;margin:0 auto;
}
.top .back{font-size:24px;line-height:1;color:var(--brand);background:none;border:0;padding:2px 8px 6px 0;cursor:pointer}
.top .ttl{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hero{
  background:linear-gradient(140deg,#126b4f,#1f9d74 62%,#37b98d);
  color:#fff;border-radius:20px;padding:22px 20px 18px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{margin:0 0 4px;font-size:21px;letter-spacing:.3px}
.hero p{margin:0;opacity:.9;font-size:13px}
.stats{display:flex;gap:8px;margin-top:16px}
.stat{flex:1 1 0;min-width:0;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;
  font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:transform .06s ease;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.wide{margin-top:10px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{margin-top:0}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{margin:0;font-size:15px;letter-spacing:.4px;color:var(--muted);font-weight:600}
.sec a{font-size:13px;color:var(--brand);text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);margin-bottom:10px}
.chap{display:flex;align-items:center;gap:12px;cursor:pointer}
.chap .no{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:var(--chip);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums
}
.chap .meta{flex:1;min-width:0}
.chap .meta b{display:block;font-size:15.5px}
.chap .meta span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .35s ease}
.bar.small{margin-top:6px;height:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.chip.lv1{color:#3d7a5f}
.chip.lv2{color:#b8791a}
.chip.lv3{color:#b8474d}
body.dark .chip.lv1{color:#7fd6b3}
body.dark .chip.lv2{color:#e0b25c}
body.dark .chip.lv3{color:#ff9aa0}
.stem{font-size:18px;line-height:1.75;font-weight:600;margin:6px 0 16px;letter-spacing:.2px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;font-size:16px;line-height:1.55;color:var(--fg);
  font-family:inherit;cursor:pointer;transition:border-color .12s,background .12s;
}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:1px
}
.opt.sel{border-color:var(--brand);background:var(--chip)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.ok{border-color:var(--ok);background:rgba(31,157,116,.1)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:rgba(207,64,64,.09)}
.opt.no .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.dim{opacity:.55}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0}
.link{color:var(--brand);background:none;border:0;font-size:14px;font-family:inherit;cursor:pointer;padding:6px}
.exp{
  border-left:3px solid var(--brand2);background:var(--card);border-radius:0 14px 14px 0;
  padding:12px 14px;margin-top:4px;font-size:14.5px;line-height:1.75;box-shadow:var(--shadow)
}
.exp .h{font-weight:700;color:var(--brand);font-size:13px;letter-spacing:.5px;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.exp .src{font-weight:400;color:var(--muted);font-size:12px}
.exp .ref{background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.big{font-size:22px;font-weight:800;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.mid{text-align:center;padding:26px 8px 10px}
.mid .emoji{font-size:44px;line-height:1.2}
.mid h3{margin:10px 0 4px;font-size:20px}
.mid p{margin:0;color:var(--muted);font-size:14px}
.review{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.review .it{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.review .it:last-child{border-bottom:0}
.review .it b{color:var(--fg);font-weight:600}
.wrong-it{display:flex;gap:10px;align-items:flex-start}
.wrong-it .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--no);margin-top:8px}
.taglist{display:flex;flex-wrap:wrap;gap:8px}
.tagcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
.tagcard b{font-weight:700}
.tagcard span{color:var(--muted);font-size:12px;margin-left:6px}
table.st{width:100%;border-collapse:collapse;font-size:13.5px}
table.st th,table.st td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}
table.st th{color:var(--muted);font-weight:600;font-size:12px}
table.st td:last-child,table.st th:last-child{text-align:right}
.note{font-size:12.5px;color:var(--muted);line-height:1.7}
.note b{color:var(--fg)}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin:26px 0 4px;line-height:1.7}
.dark-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:0 0 48px}
.switch:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand2)}
.switch.on:after{left:23px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>const Q=[];</script>
<script>
/* 第1章 绪论 */
Q.push(
{id:'c1-1',ch:'c1',t:'single',tag:'相',src:'第27页',lv:2,
 stem:'一个密闭容器中混有 N₂、O₂、CO₂ 三种气体，体系的相数是？',
 opts:['1 个相','2 个相','3 个相','无法确定'],ans:0,
 exp:'气体不论有多少种混合，只有一个气相。相是体系内部物理和化学性质完全均匀、可用机械方法分离的部分（第27页）。不要把“气体种类数”当成“相数”。'},

{id:'c1-2',ch:'c1',t:'single',tag:'相',src:'第27页',lv:2,
 stem:'把两种固体粉末充分研磨、混合均匀，体系的相数是？',
 opts:['1 个相','2 个相','3 个相','看颜色是否相同'],ans:1,
 exp:'一般有一种固体便有一个相。两种固体粉末无论混合得多均匀，颗粒之间仍存在界面、组成有突变，所以是两个相。例外是合金：熔化混匀后再凝固（第27页）。'},

{id:'c1-3',ch:'c1',t:'single',tag:'摩尔分数',src:'第32–33页',lv:2,
 stem:'质量分数为 10% 的 NaCl 水溶液中，NaCl 的摩尔分数约为？',
 opts:['0.033','0.10','0.17','0.97'],ans:0,
 exp:'取 100 g 溶液：含 NaCl 10 g、水 90 g。n(NaCl)=10/58≈0.17 mol，n(H₂O)=90/18.0=5.0 mol，χ(NaCl)=0.17/(0.17+5.0)≈0.033（第32–33页）。质量分数是质量之比，摩尔分数是物质的量之比，数值不会相同。'},

{id:'c1-4',ch:'c1',t:'single',tag:'质量分数',src:'第34页',lv:1,
 stem:'物质 B 的质量分数 ω_B 等于？',
 opts:['n_B / n','m_B / m','n_B / V','m_B / V'],ans:1,
 exp:'ω_B = m_B/m，m_B 为 B 的质量、m 为混合物（溶液）的质量，SI 单位为 1（第34页）。n_B/n 是摩尔分数，n_B/V 是物质的量浓度。'},

{id:'c1-5',ch:'c1',t:'single',tag:'物质的量浓度',src:'第29页',lv:2,
 stem:'c_B = n_B/V 中的 V 指的是？',
 opts:['溶剂体积','溶液体积','气体体积','容器容积'],ans:1,
 exp:'物质的量浓度定义为“一升溶液中所含溶质的物质的量”，V 是溶液的体积，不是溶剂体积（第29页）。这是最容易配错的地方。'},

{id:'c1-6',ch:'c1',t:'open',tag:'分压定律',src:'第38–41页',lv:2,
 stem:'某温度下，密闭容器中混有 H₂、O₂、N₂：n(H₂)=0.200 mol、n(O₂)=0.300 mol、n(N₂)=0.500 mol，混合气体总压 p=200 kPa。\n求 O₂ 的分压 p(O₂)，并说明依据和成立条件。',
 ref:'n = 0.200+0.300+0.500 = 1.000 mol\nχ(O₂) = 0.300/1.000 = 0.30\np(O₂) = χ(O₂)·p = 0.30×200 kPa = 60 kPa\n\n依据：p_B = n_BRT/V，p = nRT/V，两式相除得 p_B/p = n_B/n = x_B，即 p_B = x_B·p（第39–40页）。\n成立条件：理想气体混合物、各组分温度与体积相同、总压等于各组分分压之和（道尔顿分压定律，第38–39页）。',
 exp:'标准答案 60 kPa。关键不是背 p_B=x_B p，而是知道它由 pV=nRT 对组分和总体分别写、再相除得到；纯固体、液体不产生分压，也不参与这个式子。'},

{id:'c1-7',ch:'c1',t:'single',tag:'分压定律',src:'第40页',lv:1,
 stem:'对理想气体混合物，组分 B 的分压与总压之比 p_B/p 等于？',
 opts:['n_B/n = x_B','n/n_B','V_B/V','m_B/m'],ans:0,
 exp:'p_B/p = n_B/n = x_B，所以 p_B = x_B·p（第40页）。分压比、物质的量比、摩尔分数三者相等，这是分压计算的核心链条。'},

{id:'c1-8',ch:'c1',t:'single',tag:'理想气体',src:'第36页',lv:1,
 stem:'标准状况（101.325 kPa、273.15 K）下，1 mol 理想气体的体积约为？',
 opts:['22.414 L','24.5 L','11.2 L','8.314 L'],ans:0,
 exp:'pV=nRT，V_m=22.414 L=22.414×10⁻³ m³，由此算得 R=8.314 J·mol⁻¹·K⁻¹（第36页）。8.314 是 R 的数值，不是体积。'},

{id:'c1-9',ch:'c1',t:'single',tag:'理想气体',src:'第37页',lv:2,
 stem:'真实气体在什么条件下可以当作理想气体处理？',
 opts:['高温、高压','低温、低压','温度不太低、压力不太高','任何温度压力都可以'],ans:2,
 exp:'理想气体实际上并不存在；只有温度不太低、压力不太高的真实气体才可当作理想气体处理（第37页）。高温高压下分子间作用力和体积不可忽略，偏差最大。'},

{id:'c1-10',ch:'c1',t:'single',tag:'分压定律',src:'第38页',lv:1,
 stem:'判断：分压是指组分气体 B 在相同温度下、单独占有与混合气体相同体积时所产生的压力。',
 opts:['正确','错误'],ans:0,
 exp:'这正是课件第38页对分压的定义。注意两个“相同”：相同温度、相同体积；不是“相同压力”，也不是“单独占有容器”。'},

/* 第2章 化学热力学基础 */
{id:'c2-1',ch:'c2',t:'single',tag:'反应进度',src:'第8页',lv:3,
 stem:'同一反应写成 ①N₂+3H₂=2NH₃ 和 ②½N₂+3/2H₂=NH₃。若反应中 Δn(NH₃)=2.0 mol，两式算出的反应进度 ξ 的关系是？',
 opts:['②算出的 ξ 是①的 2 倍','两者相等','①算出的 ξ 是②的 2 倍','无法比较'],ans:0,
 exp:'①中 ν(NH₃)=2，ξ=2.0/2=1.0 mol；②中 ν(NH₃)=1，ξ=2.0/1=2.0 mol。所以 ξ 与方程式的写法有关，必须指明具体方程式；但同一方程式下，用哪种物质算 ξ 都相同（第8页）。'},

{id:'c2-2',ch:'c2',t:'single',tag:'状态函数',src:'第15–20页',lv:2,
 stem:'下列属于状态函数的是？',
 opts:['Q（热）','W（功）','H（焓）','反应热效应'],ans:2,
 exp:'P、V、T、U、H、S、G 是状态函数；热和功是系统与环境交换能量的两种形式，与具体途径有关，不是状态函数（第15、20页）。反应热效应本质是 Q，也不是状态函数。'},

{id:'c2-3',ch:'c2',t:'single',tag:'状态函数',src:'第16页',lv:1,
 stem:'状态函数的变化值具有什么特征？',
 opts:['与变化途径有关','只与始态和终态有关','只与反应时间有关','与是否做功有关'],ans:1,
 exp:'状态一定，状态函数一定；状态变化时，状态函数的变化值只与始态、终态有关，与途径无关（第16页）。这正是盖斯定律成立的热力学基础。'},

{id:'c2-4',ch:'c2',t:'single',tag:'热力学第一定律',src:'第20–23页',lv:2,
 stem:'某过程中系统放热 40 kJ，环境对系统做功 10 kJ。系统的 ΔU 为？',
 opts:['−50 kJ','−30 kJ','+30 kJ','+50 kJ'],ans:1,
 exp:'放热 Q=−40 kJ；环境对系统做功，W=+10 kJ。ΔU=Q+W=−40+10=−30 kJ（第20–23页）。符号规定：系统吸热 Q>0、系统接受环境作功 W>0，反过来取负。'},

{id:'c2-5',ch:'c2',t:'single',tag:'恒容反应热',src:'第27页',lv:2,
 stem:'封闭系统、恒容、不做非体积功时，下列成立的是？',
 opts:['Q_V = ΔH','Q_V = ΔU','Q_V = ΔU + pΔV','Q_V = 0'],ans:1,
 exp:'恒容时 ΔV=0，体积功 −pΔV=0，由 ΔU=Q+W 得 Q_V=ΔU（第27页）。不要和恒压的 Q_p=ΔH 互换。'},

{id:'c2-6',ch:'c2',t:'single',tag:'恒压反应热',src:'第28–29页',lv:2,
 stem:'Q_p = ΔH 成立的条件是？',
 opts:['恒容','恒压且不做非体积功','绝热','任何条件'],ans:1,
 exp:'封闭系统、恒压、只做体积功时，Q_p=ΔU+pΔV=ΔH（第28–29页）。恒容对应的是 Q_V=ΔU，两者不能混。'},

{id:'c2-7',ch:'c2',t:'single',tag:'焓',src:'第29页',lv:1,
 stem:'焓 H 的定义式是？',
 opts:['H = U − pV','H = U + pV','H = U + pΔV','H = Q + W'],ans:1,
 exp:'H=U+pV（第29页）。焓是状态函数，绝对值不知道，但可以求 ΔH；恒压只做体积功时 Q_p=ΔH。'},

{id:'c2-8',ch:'c2',t:'single',tag:'ΔH与ΔU',src:'第30–31页',lv:2,
 stem:'反应 C₂H₅OH(l)+3O₂(g)=2CO₂(g)+3H₂O(l) 的 Δn(g) 是？',
 opts:['−1 mol','+1 mol','−3 mol','+2 mol'],ans:0,
 exp:'Δn(g)=生成物气体物质的量−反应物气体物质的量=2−3=−1 mol。乙醇和水是液体，不计入（第30–31页）。'},

{id:'c2-9',ch:'c2',t:'open',tag:'ΔH与ΔU',src:'第31页',lv:2,
 stem:'298.15 K、100 kPa 下，1 mol 乙醇完全燃烧放出 1367 kJ 热量：\nC₂H₅OH(l)+3O₂(g)=2CO₂(g)+3H₂O(l)\n求该反应的 ΔH 和 ΔU。',
 ref:'恒温恒压下：ΔH = Q_p = −1367 kJ\nΔn(g) = 2 − 3 = −1 mol\nΔU = ΔH − Δn(g)RT\n= (−1367) − (−1)×8.314×10⁻³×298.15\n≈ −1364 kJ',
 exp:'答案 ΔH=−1367 kJ、ΔU=−1364 kJ。注意 R 取 8.314×10⁻³ kJ·mol⁻¹·K⁻¹；Δn(g) 只统计气体，液体乙醇和水不算。'},

{id:'c2-10',ch:'c2',t:'single',tag:'盖斯定律',src:'第33页',lv:2,
 stem:'盖斯定律的本质是？',
 opts:['反应热只与始态、终态有关，与途径无关','反应热只与反应物有关','反应热等于正反应活化能','反应热与温度无关'],ans:0,
 exp:'一个反应若分几步完成，总反应热等于各步反应热之和；从热力学看，ΔrHm 只取决于始、终态，与途径无关（第33页）。它是“状态函数变化与途径无关”的直接应用。'},

{id:'c2-11',ch:'c2',t:'multi',tag:'标准生成焓',src:'第39–40页',lv:3,
 stem:'下列物质中，298.15 K 标准态下 ΔfHmθ 等于 0 的有哪些？（多选）',

{id:'c2-12',ch:'c2',t:'single',tag:'标准生成焓',src:'第39、41页',lv:2,

{id:'c2-13',ch:'c2',t:'single',tag:'熵',src:'第55页',lv:3,

{id:'c2-14',ch:'c2',t:'single',tag:'熵',src:'第56页',lv:2,

{id:'c2-15',ch:'c2',t:'single',tag:'熵判据',src:'第58页',lv:2,

{id:'c2-16',ch:'c2',t:'single',tag:'吉布斯判据',src:'第64页',lv:1,

{id:'c2-17',ch:'c2',t:'single',tag:'温度判据',src:'第66页',lv:2,

{id:'c2-18',ch:'c2',t:'single',tag:'温度判据',src:'第66页',lv:2,

{id:'c2-19',ch:'c2',t:'open',tag:'分解温度',src:'第68–69页',lv:3,
 stem:'估算反应 CaCO₃(s)=CaO(s)+CO₂(g) 在标准态下的最低分解温度。\n已知 ΔrHmθ(298.15 K)=179.2 kJ·mol⁻¹，ΔrSmθ(298.15 K)=160.2 J·mol⁻¹·K⁻¹。',
 ref:'反应自发需 ΔrGmθ = ΔrHmθ − TΔrSmθ < 0\n即 T > ΔrHmθ / ΔrSmθ\nT > 179.2×10³ J·mol⁻¹ ÷ 160.2 J·mol⁻¹·K⁻¹\nT > 1118.6 K\n所以最低分解温度约为 1118.6 K（约 845 ℃）。',
 exp:'关键有两处：把 kJ 换成 J（×10³），以及“最低温度”对应 ΔG=0 的临界点。课件第69页给的答案就是 1118.6 K。'},

{id:'c2-20',ch:'c2',t:'single',tag:'标准态',src:'第38页',lv:3,

{id:'c2-21',ch:'c2',t:'single',tag:'燃烧焓',src:'第46页',lv:2,

{id:'c2-22',ch:'c2',t:'single',tag:'反应商',src:'第72–73页',lv:2,

{id:'c3-1',ch:'c3',t:'single',tag:'热力学与动力学',src:'第3–4页',lv:2,

{id:'c3-2',ch:'c3',t:'single',tag:'基元反应',src:'第8页',lv:1,

{id:'c3-3',ch:'c3',t:'single',tag:'质量作用定律',src:'第11页',lv:2,

{id:'c3-4',ch:'c3',t:'single',tag:'反应级数',src:'第12页',lv:3,
 stem:'实验测得 2NO+2H₂→N₂+2H₂O 的速率方程为 v=k·c²(NO)·c(H₂)，该反应的反应级数是？',

{id:'c3-5',ch:'c3',t:'single',tag:'速率常数',src:'第13页',lv:2,

{id:'c3-6',ch:'c3',t:'single',tag:'活化能',src:'第16页',lv:2,

{id:'c3-7',ch:'c3',t:'single',tag:'活化能与焓变',src:'第18页',lv:2,

{id:'c3-8',ch:'c3',t:'single',tag:'温度影响',src:'第19页',lv:1,

{id:'c3-9',ch:'c3',t:'single',tag:'阿仑尼乌斯',src:'第22页',lv:3,

{id:'c3-10',ch:'c3',t:'single',tag:'催化剂',src:'第25–27页',lv:2,

 exp:'催化剂改变反应途径、降低活化能，正逆反应速率同时加快，缩短到达平衡的时间；但不改变平衡状态和平衡常数，反应前后化学性质不变，且有选择性（第25–27页）。'},

{id:'c3-11',ch:'c3',t:'single',tag:'浓度影响',src:'第24页',lv:2,
 stem:'一定温度下增大反应物浓度，反应速率加快的原因是？',

{id:'c3-12',ch:'c3',t:'single',tag:'速率表示',src:'第7页',lv:2,

{id:'c4-1',ch:'c4',t:'single',tag:'平衡特征',src:'第5–6页',lv:1,

{id:'c4-2',ch:'c4',t:'single',tag:'平衡常数',src:'第7页',lv:2,

{id:'c4-3',ch:'c4',t:'single',tag:'平衡常数',src:'第8页',lv:1,

{id:'c4-4',ch:'c4',t:'single',tag:'多重平衡',src:'第12页',lv:2,

{id:'c4-5',ch:'c4',t:'single',tag:'平衡常数意义',src:'第7–8页',lv:2,

{id:'c4-6',ch:'c4',t:'single',tag:'Kθ与ΔG',src:'第17页',lv:2,

{id:'c4-7',ch:'c4',t:'single',tag:'平衡移动',src:'第21页',lv:1,

{id:'c4-8',ch:'c4',t:'single',tag:'惰性气体',src:'第26页',lv:3,

{id:'c4-9',ch:'c4',t:'single',tag:'惰性气体',src:'第26页',lv:3,

{id:'c4-10',ch:'c4',t:'single',tag:'温度影响',src:'第30页',lv:2,

{id:'c4-11',ch:'c4',t:'single',tag:'影响因素本质',src:'第28页',lv:3,

{id:'c4-12',ch:'c4',t:'single',tag:'压力影响',src:'第25页',lv:2,

<script>
/* ============ 配置 ============ */
const CH=[
  {id:'c1',no:'01',name:'绪论',sub:'相 · 浓度 · 分压定律',pages:42},
  {id:'c2',no:'02',name:'化学热力学基础',sub:'第一定律 · 焓 · 熵 · 吉布斯',pages:74},
  {id:'c3',no:'03',name:'化学动力学基础',sub:'速率 · 级数 · 活化能 · 催化',pages:30},
  {id:'c4',no:'04',name:'化学平衡',sub:'Kθ · 平衡移动 · 温度',pages:42},
  {id:'c5',no:'05',name:'物质结构',sub:'原子 · 分子 · 固体（5–7章）',pages:164},
  {id:'c8',no:'08',name:'定量分析基础',sub:'误差 · 数据处理 · 有效数字 · 滴定',pages:68}
];
const KEY='wjhx_v2';
function loadState(){
  try{const r=JSON.parse(localStorage.getItem(KEY));return (r&&r.q)?r:{q:{},dark:false}}catch(e){return {q:{},dark:false}}
}
let S=loadState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById('app');
let SS=null;
let view='home';

/* ============ 工具 ============ */
function fmt(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}
function qs(ch){return Q.filter(q=>q.ch===ch)}
function qstat(id){return S.q[id]||{n:0,ok:0,last:0}}
function attemptedCount(list){return list.filter(q=>qstat(q.id).n>0).length}
function accOf(list){
  let n=0,ok=0;list.forEach(q=>{const s=qstat(q.id);n+=s.n;ok+=s.ok});
  return n?Math.round(ok/n*100):null;
}
function wrongIds(){
  return Q.filter(q=>{const s=S.q[q.id];return s&&s.n>0&&s.last===0}).map(q=>q.id);
}
function weakTags(){
  const m={};
  Q.forEach(q=>{const s=qstat(q.id);if(s.n>=2){const t=m[q.tag]||(m[q.tag]={n:0,ok:0});t.n+=s.n;t.ok+=s.ok}});
  return Object.entries(m).map(([k,v])=>({tag:k,acc:Math.round(v.ok/v.n*100),n:v.n}))
    .filter(x=>x.acc<75).sort((a,b)=>a.acc-b.acc).slice(0,6);
}
function levelName(a,n){
  if(a===null||n<5)return '样本不足';
  if(a>=90)return '掌握较好';
  if(a>=75)return '基本掌握';
  if(a>=60)return '掌握不牢';
  return '明显薄弱';
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function record(q,ok){
  const s=S.q[q.id]||{n:0,ok:0,last:0};
  s.n++; if(ok)s.ok++; s.last=ok?1:0; S.q[q.id]=s; save();
}
function resetAll(){
  if(confirm('清空全部答题记录？此操作不可恢复。')){S={q:{},dark:S.dark};save();go('home')}
}

/* ============ 首页 ============ */
function renderHome(){
  const done=attemptedCount(Q), total=Q.length;
  let n=0,ok=0;Q.forEach(q=>{const s=qstat(q.id);n+=s.n;ok+=s.ok});
  const acc=n?Math.round(ok/n*100):0;
  const wb=wrongIds().length;
  const weak=weakTags();
  let chs='';
  CH.forEach(c=>{
    const list=qs(c.id), d=attemptedCount(list), a=accOf(list);
    const pct=list.length?Math.round(d/list.length*100):0;
    chs+=`<div class="card chap" onclick="startChapter('${c.id}')">
      <div class="no">${c.no}</div>
      <div class="meta">
        <b>${c.name}</b><span>${c.sub} · ${c.pages}页 · ${list.length}题</span>
        <div class="bar small"><i style="width:${pct}%"></i></div>
      </div>
      <div class="pct">${a===null?'未测':a+'%'}<br><span style="font-size:11px">${d}/${list.length}</span></div>
    </div>`;
  });
  let weakHtml='';
  if(weak.length){
    weakHtml=`<div class="sec"><h2>当前薄弱点（按答题记录）</h2></div>
      <div class="taglist">${weak.map(w=>`<div class="tagcard"><b>${w.tag}</b><span>${w.acc}% · ${w.n}次</span></div>`).join('')}</div>`;
  }
  app.innerHTML=`<div class="top">
      <div class="ttl">无机及分析化学 · 随身复习</div>
      <button class="link" onclick="go('stats')">统计</button>
    </div>
    <div class="wrap fade">
      <div class="hero">
        <h1>刷题不如刷懂</h1>
        <p>题源：课件 462 页 · 逐页整理 · 答案与讲解以课件为准</p>
        <div class="stats">
          <div class="stat"><b>${done}</b><span>已练 / ${total} 题</span></div>
          <div class="stat"><b>${acc}%</b><span>总正确率</span></div>
          <div class="stat"><b>${wb}</b><span>错题待清</span></div>
        </div>
      </div>
      <button class="btn primary wide" onclick="startRandom()">随机 20 题 · 摸底</button>
      <div class="row">
        <button class="btn ghost" onclick="startWrong()" ${wb?'':'disabled'}>错题重练${wb?'（'+wb+'）':''}</button>
        <button class="btn ghost" onclick="go('stats')">掌握度</button>
      </div>
      <div class="sec"><h2>按章训练</h2><a onclick="go('stats')">查看评估说明</a></div>
      ${chs}
      ${weakHtml}
      <div class="card" style="margin-top:18px">
        <div class="dark-toggle">
          <div><b style="font-size:14.5px">深色模式</b><div class="note">夜间刷题护眼</div></div>
          <div class="switch ${S.dark?'on':''}" onclick="toggleDark()"></div>
        </div>
      </div>
      <div class="note" style="margin-top:16px">
        <b>范围说明：</b>课件含第1–8章及两套练习；第9–12章（酸碱、沉淀、氧化还原、配位滴定）工作区无课件，未收录。
        每题标注课件页码，讲解只依据课件；课件自身笔误处在讲解中直接标明。
      </div>
      <div class="foot">富江 · 为爸爸定制 · 本地存储，不上传任何数据</div>
    </div>`;
}

/* ============ 开始 ============ */
function startChapter(ch){
  const list=qs(ch).map(q=>q.id);
  const c=CH.find(x=>x.id===ch);
  startQuiz(list,c.name);
}
function startRandom(){
  let ids=shuffle(Q.map(q=>q.id));
  const unseen=ids.filter(id=>qstat(id).n===0);
  const seen=ids.filter(id=>qstat(id).n>0);
  ids=unseen.concat(seen).slice(0,20);
  startQuiz(ids,'随机 20 题');
}
function startWrong(){
  const w=wrongIds(); if(!w.length)return;
  startQuiz(shuffle(w.slice()),'错题重练');
}
function startQuiz(ids,title){
  SS={ids:ids,i:0,title,ok:0,wrong:[],answered:false,sel:[],revealed:false,graded:false};
  go('quiz');
}

/* ============ 练习页 ============ */
function renderQuiz(){
  const q=Q.find(x=>x.id===SS.ids[SS.i]);
  if(!q){go('result');return}
  const s=qstat(q.id);
  const answered=SS.answered;
  const lv=q.lv===1?'基础':q.lv===2?'高频':'易错';
  let body='';
  if(q.t==='single'||q.t==='multi'){
    const multi=q.t==='multi';
    body=q.opts.map((o,i)=>{
      let cls='opt';
      if(multi&&!answered&&SS.sel.includes(i))cls+=' sel';
      if(answered){
        const isRight=multi?q.ans.includes(i):q.ans===i;
        const picked=multi?SS.sel.includes(i):SS.ans===i;
        if(isRight)cls+=' ok';
        else if(picked)cls+=' no';
        else cls+=' dim';
      }
      return `<button class="${cls}" ${answered?'disabled':''} onclick="pick(${i})">
        <span class="k">${'ABCD'[i]}</span><span>${fmt(o)}</span></button>`;
    }).join('');
    if(multi&&!answered){
      body+=`<button class="btn primary wide" onclick="submitMulti()">提交答案</button>`;
    }
  }else{
    body=`<div class="card" style="box-shadow:none">
      <div class="note">这是一道需要写过程或口述的题。先在纸上做，或在心里过一遍，再点开参考答案自评。</div></div>`;
    if(!SS.revealed){
      body+=`<button class="btn ghost wide" onclick="reveal()">显示参考答案</button>`;
    }else{
      body+=`<div class="exp"><div class="h">参考答案</div><div class="ref">${fmt(q.ref||'')}</div></div>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" onclick="selfGrade(1)">我答对了</button>
          <button class="btn ghost" onclick="selfGrade(0)">没答对 / 不会</button>
        </div>`;
    }
  }
  let exp='';
  if(answered&&q.t!=='open'){
    exp=`<div class="exp fade">
      <div class="h">${SS.ok?'答对了':'再想一步'}<span class="src">${q.src}</span></div>
      <div>${fmt(q.exp||'')}</div>
    </div>`;
  }
  if(answered&&q.t==='open'){
    exp=`<div class="exp fade">
      <div class="h">${SS.ok?'记下了':'这一题要重点回看'}<span class="src">${q.src}</span></div>
      <div>${fmt(q.exp||'')}</div>
    </div>`;
  }
  const pct=Math.round((SS.i+(answered?1:0))/SS.ids.length*100);
  app.innerHTML=`<div class="top">
      <button class="back" onclick="quitQuiz()">‹</button>
      <div class="ttl">${SS.title}</div>
      <div class="cnt">${SS.i+1}/${SS.ids.length}</div>
    </div>
    <div class="wrap fade">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="chips" style="margin-top:14px">
        <span class="chip">${q.tag}</span>
        <span class="chip">${q.src}</span>
        <span class="chip lv${q.lv}">${lv}</span>
        ${s.n>1?`<span class="chip">做过 ${s.n} 次 · 对 ${s.ok}</span>`:''}
      </div>
      <div class="stem">${fmt(q.stem)}</div>
      ${body}
      ${exp}
      ${answered?`<button class="btn primary wide" style="margin-top:18px" onclick="nextQ()">${SS.i+1>=SS.ids.length?'查看结果':'下一题'} →</button>`:''}
      ${answered?'':`<div class="tip"><button class="link" onclick="giveUp()">不会，直接看答案</button></div>`}
      <div class="tip">答案只在作答后出现，先自己判断。</div>
    </div>`;
}

window.pick=function(i){
  const q=Q.find(x=>x.id===SS.ids[SS.i]);
  if(SS.answered)return;
  if(q.t==='multi'){
    const p=SS.sel.indexOf(i);
    if(p>=0)SS.sel.splice(p,1);else SS.sel.push(i);
    renderQuiz();return;
  }
  SS.ans=i; SS.answered=true;
  const ok=(q.ans===i); SS.ok+=ok?1:0; if(!ok)SS.wrong.push(q.id);
  record(q,ok); renderQuiz();
};
window.submitMulti=function(){
  const q=Q.find(x=>x.id===SS.ids[SS.i]);
  if(SS.answered)return;
  const a=SS.sel.slice().sort().join(','), b=q.ans.slice().sort().join(',');
  const ok=(a===b);
  SS.answered=true; SS.ok+=ok?1:0; if(!ok)SS.wrong.push(q.id);
  record(q,ok); renderQuiz();
};
window.reveal=function(){SS.revealed=true;renderQuiz()};
window.selfGrade=function(ok){
  const q=Q.find(x=>x.id===SS.ids[SS.i]);
  if(SS.graded)return;
  SS.graded=true; SS.answered=true; SS.ok+=ok?1:0; if(!ok)SS.wrong.push(q.id);
  record(q,!!ok); renderQuiz();
};
window.giveUp=function(){
  const q=Q.find(x=>x.id===SS.ids[SS.i]);
  if(SS.answered)return;
  if(q.t==='open'){SS.revealed=true;renderQuiz();return}
  SS.answered=true; SS.ans=-1; if(q.t==='multi')SS.sel=[];
  SS.wrong.push(q.id); record(q,false); renderQuiz();
};
function nextQ(){
  SS.i++; SS.answered=false; SS.sel=[]; SS.revealed=false; SS.graded=false;
  if(SS.i>=SS.ids.length){go('result')}else{renderQuiz()}
}
function quitQuiz(){
  if(confirm('退出本次练习？已答题目会保留记录。')){go('home')}
}

/* ============ 结果 ============ */
function renderResult(){
  const total=SS.ids.length, ok=SS.ok, pct=Math.round(ok/total*100);
  const wrong=SS.wrong.map(id=>Q.find(q=>q.id===id));
  let tip = pct>=90?'这一章可以往深里走了。':pct>=75?'基本盘稳，错题要回看。':pct>=60?'有几个概念在打架，先补讲解。':'别急，先把这几道题的讲解读透。';
  app.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button>
      <div class="ttl">本轮结果</div><div class="cnt">${SS.title}</div></div>
    <div class="wrap fade">
      <div class="mid">
        <div class="emoji">${pct>=90?'🌿':pct>=75?'🍀':pct>=60?'🌱':'🫧'}</div>
        <div class="big">${ok} / ${total}</div>
        <p>正确率 ${pct}% · ${tip}</p>
      </div>
      ${wrong.length?`<div class="card" style="margin-top:16px">
        <div class="sec" style="margin:0 0 6px"><h2>本轮错题（${wrong.length}）</h2></div>
        ${wrong.map(q=>`<div class="review"><div class="it"><div class="wrong-it"><span class="dot"></span><div><b>${fmt(q.stem).replace(/<br>.*/,'…')}</b><br><span style="font-size:12px">${q.tag} · ${q.src}</span></div></div></div></div>`).join('')}
      </div>`:`<div class="card" style="margin-top:16px"><div class="note">本轮没有错题。可以换个章节，或者把刚才的题口述一遍检验是否真懂。</div></div>`}
      <button class="btn primary wide" style="margin-top:16px" onclick="retryWrong()" ${wrong.length?'':'disabled'}>重练本轮错题</button>
      <div class="row">
        <button class="btn ghost" onclick="go('home')">回首页</button>
        <button class="btn ghost" onclick="startRandom()">再来 20 题</button>
      </div>
    </div>`;
}
function retryWrong(){
  if(!SS.wrong.length)return;
  startQuiz(shuffle(SS.wrong.slice()),'本轮错题重练');
}

/* ============ 错题本 ============ */
function renderWrong(){
  const ids=wrongIds(), list=ids.map(id=>Q.find(q=>q.id===id));
  let body='';
  if(!list.length){body=`<div class="mid"><div class="emoji">✨</div><h3>错题本是空的</h3><p>做几道题再来。</p></div>`}
  else{
    body=`<button class="btn primary wide" onclick="startWrong()">全部重练（${list.length}）</button>`+
    list.map(q=>`<div class="card" style="margin-top:10px" onclick="singleReview('${q.id}')">
      <div class="chips" style="margin:0 0 6px"><span class="chip">${q.tag}</span><span class="chip">${q.src}</span></div>
      <div style="font-size:14.5px;font-weight:600;line-height:1.6">${fmt(q.stem).replace(/<br>.*/,'…')}</div>
    </div>`).join('');
  }
  app.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button>
      <div class="ttl">错题本</div><div class="cnt">${list.length} 题</div></div>
    <div class="wrap fade">${body}</div>`;
}
window.singleReview=function(id){startQuiz([id],'单题回看')};

/* ============ 统计 ============ */
function renderStats(){
  let rows='';
  CH.forEach(c=>{
    const list=qs(c.id),d=attemptedCount(list),a=accOf(list);
    rows+=`<tr><td>${c.no} ${c.name}</td><td>${d}/${list.length}</td><td>${a===null?'—':a+'%'}</td><td>${levelName(a,d)}</td></tr>`;
  });
  const weak=weakTags();
  app.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button>
      <div class="ttl">掌握度</div><div class="cnt">按答题记录</div></div>
    <div class="wrap fade">
      <div class="card">
        <table class="st"><thead><tr><th>章节</th><th>进度</th><th>正确率</th><th>评估</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <div class="note" style="margin-top:12px">评估只看你在这台设备答过的题：同一章节至少做满 5 题才给等级（≥90 掌握较好 / 75–89 基本掌握 / 60–74 掌握不牢 / &lt;60 明显薄弱），不足 5 题显示“样本不足”，不凭一题下结论。</div>
      </div>
      <div class="sec"><h2>薄弱知识点</h2></div>
      ${weak.length?`<div class="taglist">${weak.map(w=>`<div class="tagcard"><b>${w.tag}</b><span>${w.acc}% · ${w.n}次</span></div>`).join('')}</div>`:`<div class="note">至少答 2 次的知识点才会进入这里。</div>`}
      <div class="sec"><h2>数据</h2></div>
      <button class="btn ghost" onclick="go('wrong')">打开错题本（${wrongIds().length}）</button>
      <button class="btn ghost wide" onclick="resetAll()">清空全部记录</button>
      <div class="note" style="margin-top:16px">记录只存在这台手机的浏览器里（localStorage），换浏览器或清缓存会丢。</div>
    </div>`;
}

/* ============ 路由 ============ */
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  if(view==='home')renderHome();
  else if(view==='quiz')renderQuiz();
  else if(view==='result')renderResult();
  else if(view==='wrong')renderWrong();
  else if(view==='stats')renderStats();
}
window.go=go;window.startChapter=startChapter;window.startRandom=startRandom;
window.startWrong=startWrong;window.nextQ=nextQ;window.retryWrong=retryWrong;
window.resetAll=resetAll;window.quitQuiz=quitQuiz;
window.toggleDark=function(){S.dark=!S.dark;save();document.body.classList.toggle('dark',S.dark);renderHome()};
if(S.dark)document.body.classList.add('dark');
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='127.0.0.1' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
